version: "3.8"

services:
  atcis-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atcis-tender-scraper
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ScraperOnly=true
      - DOTNET_RUNNING_IN_CONTAINER=true
      - PORT=8080
      - SUPABASE_URL=${SUPABASE_URL:-https://pqqymbdbkwltzydymild.supabase.co}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SUPABASE_SCRAPER_EMAIL=${SUPABASE_SCRAPER_EMAIL:-scraper@atcis.internal}
      - SUPABASE_SCRAPER_PASSWORD=${SUPABASE_SCRAPER_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - Scraper__IntervalMinutes=10
      - Scraper__Pages=50
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
